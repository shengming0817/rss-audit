[package]
name = "audit-postgres-integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
testkit = { workspace = true, features = ["containers"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
anyhow.workspace = true

[dev-dependencies]
rss-audit-http-axum.workspace = true
axum.workspace = true
tower.workspace = true
serde_json.workspace = true
base64.workspace = true
rss-audit-core.workspace = true
rss-audit-postgres = { workspace = true, features = ["ledger", "messaging", "integration"] }
rss-ledger.workspace = true
rss-ledger-postgres.workspace = true
rss-transactional-messaging = { workspace = true, features = ["consumer", "producer"] }
rss-transactional-messaging-postgres = { workspace = true, features = ["integration"] }
rss-contract.workspace = true
rss-request-context.workspace = true
sqlx.workspace = true
tokio-util.workspace = true
futures.workspace = true

[[bin]]
name = "audit-test-launcher"
path = "src/main.rs"
test = false

[lints]
workspace = true
