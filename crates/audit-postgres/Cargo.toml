[package]
name = "rss-audit-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Atomic tenant-scoped PostgreSQL audit persistence"

[dependencies]
rss-audit-core.workspace = true
rss-contract.workspace = true
rss-request-context.workspace = true
rss-redact.workspace = true
rss-transactional-messaging.workspace = true
rss-ledger = { workspace = true, optional = true }
rss-ledger-postgres = { workspace = true, optional = true }
rss-transactional-messaging-postgres = { workspace = true, optional = true }
sqlx.workspace = true
thiserror.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["macros"] }
tokio-util.workspace = true

[features]
default = []
ledger = ["dep:rss-ledger", "dep:rss-ledger-postgres"]
messaging = ["dep:rss-transactional-messaging-postgres", "rss-ledger-postgres?/messaging"]
integration = []

[dev-dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
