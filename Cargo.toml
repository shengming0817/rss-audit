[workspace]
members = ["crates/audit-core", "crates/audit-postgres", "tests/audit-postgres-integration", "crates/audit-http-axum"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
version = "0.1.0"
publish = false

[workspace.dependencies]
rss-audit-http-axum = { path = "crates/audit-http-axum" }
rss-axum = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "1b0d234d79af913330e83b4103248e7107b70653", default-features = false }
axum = { version = "=0.8.9", default-features = false, features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
base64 = "0.22"
rss-audit-core = { path = "crates/audit-core" }
rss-contract = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "1b0d234d79af913330e83b4103248e7107b70653", default-features = false }
rss-diag-context = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "1b0d234d79af913330e83b4103248e7107b70653", default-features = false }
rss-ledger = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "1b0d234d79af913330e83b4103248e7107b70653", default-features = false }
rss-redact = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "1b0d234d79af913330e83b4103248e7107b70653", default-features = false }
rss-request-context = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "1b0d234d79af913330e83b4103248e7107b70653", default-features = false }
thiserror = "2"
rss-audit-postgres = { path = "crates/audit-postgres", default-features = false }
rss-ledger-postgres = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "1b0d234d79af913330e83b4103248e7107b70653", default-features = false }
rss-transactional-messaging = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "1b0d234d79af913330e83b4103248e7107b70653", default-features = false }
rss-transactional-messaging-postgres = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "1b0d234d79af913330e83b4103248e7107b70653", default-features = false }
testkit = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "1b0d234d79af913330e83b4103248e7107b70653", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio = { version = "1", default-features = false }
tokio-util = "0.7"
futures = "0.3"
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
cognitive_complexity = "warn"
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
