[workspace]
members = ["crates/audit-core"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
version = "0.1.0"
publish = false

[workspace.dependencies]
rss-audit-core = { path = "crates/audit-core" }
rss-contract = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "c3fbd187b8d97ff25cc5968243062d1521714fb7", default-features = false }
rss-diag-context = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "c3fbd187b8d97ff25cc5968243062d1521714fb7", default-features = false }
rss-ledger = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "c3fbd187b8d97ff25cc5968243062d1521714fb7", default-features = false }
rss-redact = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "c3fbd187b8d97ff25cc5968243062d1521714fb7", default-features = false }
rss-request-context = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "c3fbd187b8d97ff25cc5968243062d1521714fb7", default-features = false }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
cognitive_complexity = "warn"
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
